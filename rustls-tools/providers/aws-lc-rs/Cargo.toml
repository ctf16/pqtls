[package]
name = "pqc-rustls-aws-lc-rs"
description = "pqc-bench rustls tools with rustls's aws-lc-rs provider (AWS-LC, bundled by aws-lc-sys)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# libhsloop_rustls.a: the hsloop adapter (linked with hsloop/hsloop.c by setup.sh)
[lib]
name = "hsloop_rustls"
crate-type = ["staticlib"]

[[bin]]
name = "pqc-rustls"
path = "src/main.rs"

[dependencies]
pqc-rustls = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }

# setup.sh --fips: AWS-LC's FIPS module (aws-lc-fips-sys) instead (pqc-rustls-aws-lc-rs-fips)
[features]
fips = ["rustls/fips"]
