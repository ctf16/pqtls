[package]
name = "pqc-rustls-graviola-pq"
description = "pqc-bench rustls tools with rustls-provider-graviola-pq (our own provider on graviola, including ML-KEM-768)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# libhsloop_rustls.a: the hsloop adapter (linked with hsloop/hsloop.c by setup.sh)
[lib]
name = "hsloop_rustls"
crate-type = ["staticlib"]

[[bin]]
name = "pqc-rustls"
path = "src/main.rs"

# the provider and its tests: https://github.com/ctf16/rustls-provider-graviola-pq
[dependencies]
pqc-rustls = { workspace = true }
rustls-provider-graviola-pq = "=0.1.0"
